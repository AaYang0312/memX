name: Go checks (personal development)

on:
  push:
    branches: [main]
  pull_request:

# Public source-only repo: no production secrets or write-capable token.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOPROXY: "off" # standard-library-only personal development track
      GOSUMDB: "off"
      GOTOOLCHAIN: "local"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 commit (Node 24), checked 2026-09-23
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6 commit (Node 24), checked 2026-09-23
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l ./cmd ./internal ./deploy)"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Run tests
        run: go test ./...
      - name: Run vet
        run: go vet ./...
